<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Dev in_ - User Dropdown Menu</title>
<!-- Load Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Courier New', 'monospace'],
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'brutal': '3px 3px 0px #000000',
            'brutal-lg': '5px 5px 0px #000000',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Neo-Brutalism Styles -->
<style data-purpose="neo-brutalism-borders">
    .border-brutal {
      border: 2px solid #000000;
    }
    .border-brutal-thick {
      border: 2.5px solid #000000;
    }
    .shadow-hard {
      box-shadow: 4px 4px 0px 0px #000000;
    }
  </style>
<!-- END: Custom Neo-Brutalism Styles -->
</head>
<body class="text-gray-900 font-sans min-h-screen flex flex-col antialiased" style="background-color: rgb(255, 253, 245); background-image: radial-gradient(rgb(217, 212, 195) 1.2px, transparent 1.2px); background-size: 18px 18px;">
<!-- BEGIN: GlobalNavigationBar -->
<header class="w-full bg-white border-b-2 sticky top-0 z-40 border-[#111111] border-black" data-purpose="site-header">
<div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
<!-- Brand Logo -->
<div class="flex items-center gap-6">
<a href="#" class="flex items-center gap-1.5 no-underline"><span class="text-2xl font-black text-[#111111] tracking-tight font-sans">Dev</span><span class="bg-[#FFD43B] border-2 border-[#111111] px-1.5 py-0.5 rounded text-lg font-mono font-bold text-[#111111] shadow-[2px_2px_0_#111111]">in_</span></a>
</div>
<!-- Center Search Input -->
<div class="flex items-center justify-center flex-1 max-w-[460px] mx-6 hidden md:flex"><div class="relative w-full"><input class="w-full h-[40px] px-3.5 py-2 bg-white border-2 border-black rounded-[8px] text-sm text-[#111111] placeholder:text-[#888888] focus:outline-none focus:ring-0 focus:shadow-[2px_2px_0_#111111] transition-all" data-purpose="header-search-input" placeholder="검색어를 입력하세요" type="text"></div></div>
<!-- Right Navigation Action Items -->
<div class="flex items-center gap-2.5 relative">
<!-- Question Action Button -->
<button class="h-10 px-4 text-sm font-bold bg-[#2563EB] text-white border-2 border-black rounded-[8px] shadow-[2px_2px_0_#111111] hover:bg-blue-600 active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all flex items-center gap-1.5" type="button"><span>질문하기</span></button>
<!-- Notification Button -->
<button class="h-10 px-3 text-sm font-bold bg-white border-2 border-black shadow-[2px_2px_0px_#000000] hover:bg-neutral-50 flex items-center gap-1" type="button"><span>알림</span>
<span class="bg-red-600 text-white text-xs font-bold w-5 h-5 rounded-full inline-flex items-center justify-center ml-1">3</span></button>
<!-- User Profile Dropdown Trigger (Active State) -->
<div class="relative">
<button aria-expanded="true" aria-haspopup="true" class="h-10 px-3.5 text-sm font-bold bg-[#FFD43B] text-[#111111] border-[2.5px] border-[#111111] rounded-[10px] shadow-[2px_2px_0px_#000000] flex items-center gap-1.5 focus:outline-none" data-purpose="user-dropdown-trigger" id="user-menu-button" type="button">
<span>닉네임</span>
<span class="text-xs">▲</span>
</button>
</div>
</div>
</div>
</header>
<!-- END: GlobalNavigationBar -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 relative" data-purpose="main-layout">
<!-- Code/Req Spec Annotations -->
<div class="text-[11px] font-mono text-gray-400 mb-4">
      공통 헤더 (REQ-FOOTER-001)
    </div>
<!-- Dropdown & Spec Note Overlay Container -->
<div class="relative w-full">
<!-- Right-aligned Dropdown Context Wrapper -->
<div class="flex justify-end items-start gap-4 mb-6">
<!-- Left Wireframe Note/Tooltip for Admin Menu -->
<aside class="hidden sm:block mt-2 bg-amber-100 border-2 border-amber-400 text-amber-950 p-3 text-xs rounded shadow-[2px_2px_0px_#f59e0b] max-w-xs animate-pulse" data-purpose="admin-visibility-annotation">
<div class="font-bold mb-0.5 flex items-center gap-1">
<span class="inline-block w-2 h-2 rounded-full bg-amber-500"></span>
            관리자 페이지 메뉴
          </div>
<div class="text-neutral-700 leading-snug">
            관리자 계정에만 보임 (일반 회원은 안 보임)
          </div>
</aside>
<!-- BEGIN: UserProfileDropdownCard -->
<div aria-labelledby="user-menu-button" aria-orientation="vertical" class="w-64 bg-white border-brutal-thick shadow-hard z-50 text-left" data-purpose="user-profile-dropdown" id="user-profile-menu" role="menu">
<!-- User Profile Info Header -->
<div class="p-4 border-b-2 border-black bg-neutral-50" data-purpose="dropdown-header">
<div class="flex items-center gap-1 text-base font-black">
<span>닉네임</span>
<span class="text-amber-500 text-sm leading-none" title="우수 회원">★</span>
</div>
<div class="text-xs text-neutral-500 font-mono mt-0.5">
              @user_id
            </div>
</div>
<!-- Dropdown Navigation Links -->
<nav class="flex flex-col text-sm font-semibold" data-purpose="dropdown-links">
<a class="px-4 py-3 hover:bg-neutral-100 border-b border-neutral-200 transition-colors flex items-center justify-between" href="#profile-view" role="menuitem">
<span>프로필 이동</span>
</a>
<a class="px-4 py-3 hover:bg-neutral-100 border-b border-neutral-200 transition-colors flex items-center justify-between" href="#profile-edit" role="menuitem">
<span>프로필 수정</span>
</a>
<!-- Admin Page Option with badge -->
<a class="px-4 py-3 hover:bg-amber-50 bg-amber-50/30 transition-colors flex items-center justify-between text-neutral-900 border-b-2 border-dashed border-neutral-300" href="#admin-page" role="menuitem">
<div class="flex items-center gap-1.5">
<span>관리자 페이지</span>
<span class="text-[10px] px-1 py-0.5 bg-neutral-900 text-white rounded font-mono font-normal">ADMIN</span>
</div>
</a>
<!-- Danger/Logout Option -->
<a class="px-4 py-3 text-red-600 hover:bg-red-50 transition-colors flex items-center justify-between font-bold" href="#logout" role="menuitem">
<span>로그아웃</span>
</a>
</nav>
</div>
<!-- END: UserProfileDropdownCard -->
</div>
<!-- BEGIN: QuestionListPlaceholder -->
<!-- Wireframe Background Content (Dotted Canvas representing MAIN-001) -->
<section aria-label="질문 목록 본문 자리표시자" class="w-full min-h-[420px] rounded border-2 border-dashed border-neutral-300 bg-neutral-50/50 flex flex-col items-center justify-center p-8 select-none" data-purpose="background-content-placeholder">
<div class="text-center">
<div class="w-12 h-12 mx-auto mb-3 border-2 border-dashed border-neutral-400 rounded-lg flex items-center justify-center text-neutral-400 font-mono text-xl">
            #
          </div>
<p class="text-sm font-medium text-neutral-400">
            질문 목록 영역 (MAIN-001과 동일)
          </p>
<p class="text-xs text-neutral-400 mt-1">
            드롭다운 메뉴 활성화 시 배경 화면은 비활성/유지 상태입니다.
          </p>
</div>
</section>
<!-- END: QuestionListPlaceholder -->
</div>
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: SiteFooter -->
<footer class="w-full border-t border-neutral-200 mt-auto py-6 bg-white" data-purpose="site-footer">
<div class="max-w-7xl mx-auto px-4 text-center text-xs text-neutral-400 font-mono">
      Dev in_ Platform © 2024. All rights reserved.
    </div>
</footer>
<!-- END: SiteFooter -->


















</body></html>
