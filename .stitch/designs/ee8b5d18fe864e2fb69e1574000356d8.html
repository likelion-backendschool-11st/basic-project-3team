<!-- BEGIN: Interactivity Script -->
<script data-purpose="event-handlers">
    // Simple script to toggle tag selection and close keyword tags
    document.querySelectorAll('[data-purpose="recent-keywords"] button').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const parentTag = btn.closest('.group');
        if (parentTag) {
          parentTag.remove();
        }
      });
    });
  </script>
<!-- END: Interactivity Script -->
