<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>프로필 수정</title>
<!-- Load Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Config -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              surface: '#f3f4f6',
              border: '#111827',
              primary: '#bfdbfe',
              accent: '#3b82f6',
              tag: '#f9fafb'
            }
          },
          boxShadow: {
            'brutal': '3px 3px 0px #111827',
            'brutal-sm': '2px 2px 0px #111827',
            'brutal-lg': '4px 4px 0px #111827'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Neobrutalism aesthetics -->
<style data-purpose="neobrutalism-theme">
    .neo-border {
      border: 2px solid #111827;
    }
    .neo-input {
      border: 2px solid #111827;
      border-radius: 4px;
      transition: all 0.15s ease-in-out;
    }
    .neo-input:focus {
      outline: none;
      box-shadow: 2px 2px 0px #111827;
      border-color: #111827;
    }
    .neo-btn {
      border: 2px solid #111827;
      box-shadow: 2px 2px 0px #111827;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #111827;
    }
  </style>
</head>
<body class="min-h-screen text-gray-900 sm:px-6 lg:px-8 font-sans antialiased pb-8" style="background-color: rgb(255, 253, 245); background-image: radial-gradient(rgb(217, 212, 195) 1px, transparent 1px); background-size: 18px 18px;">
<!-- BEGIN: MainContainer -->
<header class="w-full bg-white border-b-[2.5px] border-[#111111] px-6 py-3 flex items-center justify-between mb-8">
  <div class="flex items-center gap-6">
    <a href="#" class="flex items-center font-sans font-black text-2xl tracking-tight text-[#111111] select-none no-underline">
      Dev<span class="bg-[#FFD43B] border-2 border-black px-1.5 py-0.5 rounded text-black font-mono font-bold text-sm ml-1">in_</span>
    </a>
    <div class="hidden sm:block w-72 md:w-80">
      <input type="text" placeholder="검색어를 입력하세요" class="w-full px-3 py-1.5 text-sm bg-white border-[2.5px] border-[#111111] rounded-[8px] focus:outline-none placeholder-gray-400 font-medium">
    </div>
  </div>
  <div class="flex items-center gap-3">
    <button type="button" class="bg-[#2563EB] text-white font-bold border-2 border-black rounded-[8px] shadow-[2px_2px_0_#111111] px-3.5 py-1.5 text-sm hover:opacity-90 transition-opacity">
      질문하기
    </button>
    <button type="button" class="bg-white text-gray-900 font-bold border-2 border-black rounded-[8px] shadow-[2px_2px_0_#111111] px-3 py-1.5 text-sm flex items-center hover:bg-gray-50">
      알림<span class="bg-red-600 text-white rounded-full text-xs px-1.5 py-0.2 font-bold ml-1 leading-none inline-flex items-center justify-center">3</span>
    </button>
    <button type="button" class="bg-[#FFD43B] text-gray-900 font-bold border-2 border-black rounded-[8px] shadow-[2px_2px_0_#111111] px-3.5 py-1.5 text-sm flex items-center gap-1 hover:bg-[#fed33a]">
      <span>코딩하는곰돌이</span>
      <span class="text-xs">▾</span>
    </button>
  </div>
</header><main class="max-w-4xl mx-auto space-y-6 px-4" data-purpose="profile-edit-container">
<!-- BEGIN: HeaderSection -->
<header class="flex items-center justify-between pb-2" data-purpose="page-header">
<h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900">
        프로필 수정
      </h1>
<!-- Return to My Page Link -->
<a class="bg-white hover:bg-gray-50 text-gray-900 text-sm font-bold px-4 py-2 rounded-[8px] border-[2.5px] border-[#111111] shadow-[2px_2px_0px_#111111] flex items-center space-x-1 transition-all" data-purpose="return-mypage-btn" href="#"><span>← 마이페이지</span></a>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: ProfileEditForm -->
<form class="space-y-6" id="profile-edit-form" onsubmit="event.preventDefault();">
<!-- BEGIN: BasicInfoCard (상단 기본 정보) -->
<section class="bg-white neo-border rounded-2xl p-6 sm:p-8 shadow-sm space-y-6" data-purpose="basic-info-section">
<!-- Nickname Row -->
<div class="grid grid-cols-1 sm:grid-cols-12 gap-3 sm:gap-4 items-center">
<label class="sm:col-span-2 text-base font-bold text-gray-800" for="nickname">
            닉네임
          </label>
<div class="sm:col-span-10 flex flex-col sm:flex-row gap-3">
<input class="neo-input flex-1 px-3 py-2 text-sm sm:text-base bg-white" id="nickname" name="nickname" placeholder="닉네임을 입력하세요" type="text" value="코딩하는곰돌이">
<button class="neo-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold text-sm px-4 py-2 rounded shrink-0" data-purpose="check-duplicate-btn" type="button">
              중복 확인
            </button>
</div>
</div>
<!-- Bio (소개글) Row -->
<div class="grid grid-cols-1 sm:grid-cols-12 gap-3 sm:gap-4 items-start">
<label class="sm:col-span-2 text-base font-bold text-gray-800 pt-2" for="bio">
            소개글
          </label>
<div class="sm:col-span-10 space-y-2">
<div class="relative">
<textarea class="neo-input w-full p-3 text-sm sm:text-base resize-none bg-white block" id="bio" maxlength="200" name="bio" placeholder="자신을 자유롭게 소개해 주세요." rows="4"></textarea>
<!-- Character Counter inside/under textarea -->
<span class="absolute bottom-2.5 right-3 text-xs text-gray-500 font-medium select-none pointer-events-none" id="char-counter">
                0 / 200
              </span>
</div>
<!-- Validation Hint Notice -->
<p class="text-xs text-gray-500 font-medium flex items-center">
              ※ 잘못된 입력값은 칸 아래에 빨간 에러 텍스트로 표시
            </p>
</div>
</div>
</section>
<!-- END: BasicInfoCard -->
<!-- BEGIN: DetailsGrid (하단 2열 카드 영역) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6" data-purpose="details-grid">
<!-- BEGIN: CareerCard (좌측 하단 경력 카드) -->
<section class="bg-white neo-border rounded-2xl p-6 flex flex-col justify-between shadow-sm space-y-6" data-purpose="career-section">
<div class="space-y-6">
<h2 class="text-lg font-bold text-gray-900 border-b border-gray-200 pb-2">
              경력
            </h2>
<!-- Experience Years Dropdown -->
<div class="flex items-center justify-between sm:justify-start gap-4">
<span class="text-sm sm:text-base font-bold text-gray-800 w-16">연차</span>
<div class="relative w-36">
<select class="neo-input w-full appearance-none bg-white py-2 pl-3 pr-8 text-sm font-semibold cursor-pointer" id="experience-years" name="experience_years">
<option value="신입">신입</option>
<option value="1년차">1년차</option>
<option value="2년차">2년차</option>
<option selected="" value="3년차">3년차</option>
<option value="4년차">4년차</option>
<option value="5년차 이상">5년차 이상</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-800">
<span class="text-xs font-bold">▼</span>
</div>
</div>
</div>
<!-- Tech Stack Selection Area -->
<div class="space-y-3">
<span class="block text-sm sm:text-base font-bold text-gray-800">기술 스택</span>
<!-- Badges Container -->
<div class="flex flex-wrap gap-2" data-purpose="tech-badges" id="tech-stack-badges">
<span class="neo-border bg-white text-gray-800 text-xs sm:text-sm font-medium px-3 py-1 rounded-full flex items-center space-x-1 shadow-sm">
<span>Java</span>
<button aria-label="Java 제거" class="ml-1 text-gray-500 hover:text-black font-bold focus:outline-none" type="button">×</button>
</span>
<span class="neo-border bg-white text-gray-800 text-xs sm:text-sm font-medium px-3 py-1 rounded-full flex items-center space-x-1 shadow-sm">
<span>Spring</span>
<button aria-label="Spring 제거" class="ml-1 text-gray-500 hover:text-black font-bold focus:outline-none" type="button">×</button>
</span>
<span class="neo-border bg-white text-gray-800 text-xs sm:text-sm font-medium px-3 py-1 rounded-full flex items-center space-x-1 shadow-sm">
<span>MySQL</span>
<button aria-label="MySQL 제거" class="ml-1 text-gray-500 hover:text-black font-bold focus:outline-none" type="button">×</button>
</span>
</div>
<!-- Tech Stack Search Input -->
<div>
<input class="neo-input w-full px-3 py-2 text-sm bg-white placeholder-gray-400" id="tech-stack-input" placeholder="기술 스택 검색 후 추가" type="text">
</div>
</div>
</div>
<!-- Card Footer Hint -->
<div class="pt-4 border-t border-gray-100">
<p class="text-xs text-gray-500 font-medium">
              ※ 등록한 경력은 질문/답변 옆에 함께 표시
            </p>
</div>
</section>
<!-- END: CareerCard -->
<!-- BEGIN: InterestsCard (우측 하단 관심 카테고리 카드) -->
<section class="bg-white neo-border rounded-2xl p-6 flex flex-col justify-between shadow-sm space-y-6" data-purpose="interests-section">
<div class="space-y-4">
<!-- Title & Sub-instruction -->
<div>
<h2 class="text-lg font-bold text-gray-900">
                관심 카테고리
              </h2>
<p class="text-xs text-gray-500 mt-0.5">
                (관심 있는 태그를 검색해서 추가)
              </p>
</div>
<!-- Interest Tags Container -->
<div class="flex flex-wrap gap-2 pt-1" data-purpose="interest-tag-badges" id="interest-badges">
<span class="neo-border bg-white text-gray-800 text-xs sm:text-sm font-medium px-3 py-1 rounded-full flex items-center space-x-1 shadow-sm">
<span>#Spring</span>
<button aria-label="Spring 태그 제거" class="ml-1 text-gray-500 hover:text-black font-bold focus:outline-none" type="button">×</button>
</span>
<span class="neo-border bg-white text-gray-800 text-xs sm:text-sm font-medium px-3 py-1 rounded-full flex items-center space-x-1 shadow-sm">
<span>#React</span>
<button aria-label="React 태그 제거" class="ml-1 text-gray-500 hover:text-black font-bold focus:outline-none" type="button">×</button>
</span>
<span class="neo-border bg-white text-gray-800 text-xs sm:text-sm font-medium px-3 py-1 rounded-full flex items-center space-x-1 shadow-sm">
<span>#MySQL</span>
<button aria-label="MySQL 태그 제거" class="ml-1 text-gray-500 hover:text-black font-bold focus:outline-none" type="button">×</button>
</span>
<span class="neo-border bg-white text-gray-800 text-xs sm:text-sm font-medium px-3 py-1 rounded-full flex items-center space-x-1 shadow-sm">
<span>#Docker</span>
<button aria-label="Docker 태그 제거" class="ml-1 text-gray-500 hover:text-black font-bold focus:outline-none" type="button">×</button>
</span>
</div>
<!-- Interest Tag Search Input -->
<div class="pt-1">
<input class="neo-input w-full px-3 py-2 text-sm bg-white placeholder-gray-400" id="interest-input" placeholder="태그 검색 후 추가" type="text">
</div>
</div>
<!-- Notification Toggle Row -->
<div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-3" data-purpose="notification-toggle-wrapper">
<span class="text-sm font-bold text-gray-800">새 질문 알림</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" id="notification-toggle" type="checkbox">
<!-- Switch Body -->
<div class="w-12 h-6 bg-gray-300 peer-focus:outline-none neo-border rounded-full peer peer-checked:bg-slate-400 peer-checked:after:translate-x-6 peer-checked:after:border-gray-900 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-2 after:border-gray-900 after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
</label>
</div>
</section>
<!-- END: InterestsCard -->
</div>
<!-- END: DetailsGrid -->
<!-- BEGIN: ActionButtons (최하단 저장/취소 버튼) -->
<div class="flex items-center justify-end space-x-4 pt-4" data-purpose="form-actions">
<!-- Cancel Button -->
<button class="neo-btn bg-white hover:bg-gray-100 text-gray-900 font-bold px-8 py-2.5 rounded text-sm sm:text-base min-w-[100px]" data-purpose="cancel-btn" type="button">
          취소
        </button>
<!-- Submit / Save Button -->
<button class="neo-btn bg-slate-300 hover:bg-slate-400 text-gray-900 font-bold px-8 py-2.5 rounded text-sm sm:text-base min-w-[100px]" data-purpose="save-btn" type="submit">
          저장
        </button>
</div>
<!-- END: ActionButtons -->
</form>
<!-- END: ProfileEditForm -->
</main>
<!-- END: MainContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="character-counter">
    // Dynamically update character count for introduction textarea
    const bioTextarea = document.getElementById('bio');
    const charCounter = document.getElementById('char-counter');

    if (bioTextarea && charCounter) {
      bioTextarea.addEventListener('input', function() {
        const length = this.value.length;
        charCounter.textContent = `${length} / 200`;
      });
    }
  </script>
<!-- END: InteractiveScripts -->




</body></html>
