<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Dev in_ 닉네임 사용 가능 확인</title>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#2563eb',
            dark: '#111827',
          },
          boxShadow: {
            'brutal': '8px 8px 0px #111111',
            'brutal-sm': '4px 4px 0px #111111',
            'brutal-active': '0px 0px 0px #111111',
          }
        }
      }
    };
  </script>
<style data-purpose="custom-brutalism">
    .border-brutal {
      border: 2.5px solid #111111;
    }
    .shadow-hard {
      box-shadow: 8px 8px 0px #111111;
    }
    .shadow-hard-sm {
      box-shadow: 4px 4px 0px #111111;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 min-h-screen relative overflow-hidden" style="background-color: rgb(255, 253, 245); background-image: radial-gradient(rgb(217, 212, 195) 1px, transparent 1px); background-size: 18px 18px;">
<!-- BEGIN: BlurredBackgroundContent -->
<!-- 회원가입 화면 레이아웃 (배경으로 흐릿하게 처리됨) -->
<div class="w-full min-h-screen flex flex-col filter blur-sm pointer-events-none select-none" data-purpose="background-signup-page">
<!-- 상단 네비게이션 바 -->
<header class="w-full border-b-[2.5px] border-black bg-white px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-1 cursor-pointer select-none"><span class="text-2xl font-black text-black tracking-tight font-sans">Dev</span><span class="text-xl font-black text-black bg-[#FFD43B] px-1.5 py-0.5 rounded border-2 border-black shadow-[2px_2px_0px_#111]">in_</span></div>
<div class="flex items-center gap-3">
<span class="text-sm font-medium text-gray-500">이미 계정이 있으신가요?</span>
<button class="border-2 border-black px-3 py-1 font-bold text-sm bg-white shadow-[2px_2px_0px_#111]">
          로그인 →
        </button>
</div>
</header>
<!-- 배경 폼 플레이스홀더 그리드 -->
<main class="flex-1 max-w-5xl mx-auto w-full p-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-start opacity-40">
<div class="border-[2.5px] border-black bg-white p-6 rounded-xl h-[520px]">
<div class="h-6 w-32 bg-gray-200 mb-6 rounded"></div>
<div class="space-y-4">
<div class="h-10 bg-gray-100 border border-gray-300 rounded"></div>
<div class="h-10 bg-gray-100 border border-gray-300 rounded"></div>
<div class="h-10 bg-gray-100 border border-gray-300 rounded"></div>
</div>
</div>
<div class="border-[2.5px] border-black bg-white p-6 rounded-xl h-[520px]">
<div class="h-6 w-32 bg-gray-200 mb-6 rounded"></div>
<div class="space-y-4">
<div class="h-10 bg-gray-100 border border-gray-300 rounded"></div>
<div class="h-10 bg-gray-100 border border-gray-300 rounded"></div>
<div class="h-10 bg-gray-100 border border-gray-300 rounded"></div>
</div>
</div>
</main>
</div>
<!-- END: BlurredBackgroundContent -->
<!-- BEGIN: ModalBackdrop -->
<!-- 어두운 오버레이 레이어 -->
<div class="fixed inset-0 bg-black/40 z-40 backdrop-blur-[2px] transition-opacity" data-purpose="modal-overlay" style="background-color: rgba(255, 253, 245, 0.55); backdrop-filter: blur(8px);"></div>
<!-- END: ModalBackdrop -->
<!-- BEGIN: AvailableNicknameModal -->
<!-- 중앙 팝업 모달 컨테이너 -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4" data-purpose="modal-container">
<div class="w-full max-w-[440px] bg-white border-brutal shadow-hard rounded-2xl p-6 sm:p-7 relative transition-all" data-purpose="nickname-confirmation-dialog" id="nickname-success-modal" style="background-color: rgb(255, 255, 255); border: 2.5px solid rgb(17, 17, 17); border-radius: 14px; box-shadow: rgb(17, 17, 17) 8px 8px 0px;">
<!-- 모달 닫기 버튼 -->
<button aria-label="닫기" class="absolute top-4 right-4 text-gray-500 hover:text-black p-1.5 rounded-lg hover:bg-gray-100 transition-colors focus:outline-none" data-purpose="close-modal-button" type="button">
<svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- 상단 체크 아이콘 -->
<div class="flex justify-center mt-2 mb-4" data-purpose="status-icon">
<div class="w-16 h-16 rounded-full border-brutal bg-emerald-100 flex items-center justify-center shadow-hard-sm" style="border: 2.5px solid rgb(17, 17, 17); box-shadow: rgb(17, 17, 17) 4px 4px 0px;">
<svg class="w-8 h-8 text-black stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- 타이틀 & 안내 텍스트 -->
<div class="text-center mb-6" data-purpose="modal-header-text">
<h2 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight mb-2">
          사용 가능한 닉네임입니다!
        </h2>
<p class="text-sm text-gray-600 leading-relaxed break-keep px-2">
<span class="font-bold text-gray-900">'dev_coding'</span>은(는) 즉시 사용할 수 있습니다.<br>
          이 닉네임으로 가입을 계속 진행하시겠습니까?
        </p>
</div>
<!-- 상세 검증 정보 박스 -->
<section class="bg-gray-50 border-brutal rounded-xl p-4 mb-6 text-sm" data-purpose="verification-details">
<div class="flex items-center justify-between py-1.5 border-b border-gray-200">
<span class="text-gray-500 font-medium">상세 검사 결과</span>
<span class="font-bold text-emerald-600 flex items-center gap-1">
<svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
            검증 통과
          </span>
</div>
<div class="flex items-center justify-between pt-2">
<span class="text-gray-500 font-medium">입력 닉네임</span>
<span class="font-mono font-bold text-gray-900 text-base">dev_coding</span>
</div>
</section>
<!-- 액션 버튼 그룹 -->
<div class="flex flex-col gap-3" data-purpose="modal-actions">
<!-- 닉네임 확정 버튼 -->
<button class="w-full py-3.5 px-4 bg-yellow-400 hover:bg-yellow-300 border-brutal shadow-hard-sm active:translate-x-1 active:translate-y-1 active:shadow-none transition-all font-black text-gray-900 flex items-center justify-center gap-1.5 text-base" data-purpose="confirm-action-button" id="confirm-nickname-btn" type="button" style="background-color: rgb(255, 212, 59); color: rgb(17, 17, 17); border: 2.5px solid rgb(17, 17, 17); box-shadow: rgb(17, 17, 17) 3px 3px 0px; border-radius: 8px;">
<span>이 닉네임 사용하기</span>
<svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- 다른 닉네임 입력 (재입력) 버튼 -->
<button class="w-full py-3 px-4 bg-white hover:bg-gray-50 border-brutal shadow-hard-sm active:translate-x-1 active:translate-y-1 active:shadow-none transition-all font-bold text-gray-700 text-sm" data-purpose="cancel-action-button" id="change-nickname-btn" type="button" style="background-color: rgb(255, 255, 255); color: rgb(17, 17, 17); border: 2.5px solid rgb(17, 17, 17); box-shadow: rgb(17, 17, 17) 3px 3px 0px; border-radius: 8px;">
          다른 닉네임 입력
        </button>
</div>
</div>
</div>
<!-- END: AvailableNicknameModal -->


</body></html>
