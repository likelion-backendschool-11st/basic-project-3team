<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Dev in_ | 답변 및 답글 수정 중</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=Pretendard:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FFFDF5',
              yellow: '#FFE600',
              blue: '#2563EB',
              'blue-light': '#EFF6FF',
              green: '#22C55E',
              'green-light': '#DCFCE7',
              red: '#EF4444',
              dark: '#111827',
            }
          },
          fontFamily: {
            sans: ['Pretendard', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          },
          boxShadow: {
            'brutal': '4px 4px 0px 0px #000000',
            'brutal-sm': '2.5px 2.5px 0px 0px #000000',
            'brutal-hover': '1px 1px 0px 0px #000000',
            'brutal-blue': '4px 4px 0px 0px #2563EB'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="background-pattern">
    /* Subtle dot grid background for neo-brutalism feel */
    body {
      background-color: #FFFDF5;
      background-image: radial-gradient(#000000 0.75px, transparent 0.75px);
      background-size: 24px 24px;
    }
  </style>
<style data-purpose="neobrutalism-helpers">
    .neo-border {
      border: 2.5px solid #000000;
    }
    .neo-border-blue {
      border: 2.5px solid #2563EB;
    }
    .neo-btn {
      border: 2.5px solid #000000;
      transition: all 0.12s ease-in-out;
      font-weight: 700;
    }
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px 0px #000000;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen text-slate-900 font-sans antialiased selection:bg-brand-yellow selection:text-black" style="background-color: rgb(255, 253, 245); background-image: radial-gradient(rgb(217, 212, 195) 1px, transparent 1px); background-size: 18px 18px;">
<!-- BEGIN: MainHeader -->
<header class="w-full bg-[#FFFDF5] border-b-[2.5px] border-black sticky top-0 z-50 px-4 py-3" data-purpose="global-navigation">
<div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
<!-- Brand Logo -->
<div class="flex items-center gap-3">
<a href="#" class="flex items-center gap-1.5 text-xl font-black tracking-tight text-[#111111]">
  <span>Dev</span>
  <span class="bg-[#FFD43B] border-[2.5px] border-[#111111] px-1.5 py-0.5 rounded text-sm font-mono font-bold shadow-[2px_2px_0_0_#111111]">in_</span>
</a>
</div>
<!-- Search Input Container -->
<div class="flex-1 max-w-xl relative"><input type="text" placeholder="검색어를 입력하세요 (단축키 '/')" class="w-full h-10 px-4 py-2 border-[2.5px] border-[#111111] rounded-lg bg-white placeholder-slate-400 font-medium text-sm focus:outline-none focus:ring-0 shadow-brutal-sm"></div>
<!-- Header Action Nav -->
<nav class="flex items-center gap-2.5"><button class="bg-blue-600 text-white font-bold text-sm px-4 py-1.5 border-[2.5px] border-[#111111] shadow-[3px_3px_0_0_#111111] hover:-translate-y-0.5 active:shadow-none transition-transform">질문하기</button><button class="relative bg-white font-bold text-sm px-3.5 py-1.5 border-[2.5px] border-[#111111] shadow-[3px_3px_0_0_#111111] hover:-translate-y-0.5 flex items-center justify-center">알림<span class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 text-white text-[10px] font-black rounded-full border border-black flex items-center justify-center leading-none">3</span></button><button class="bg-[#FFD43B] font-bold text-sm px-3.5 py-1.5 border-[2.5px] border-[#111111] shadow-[3px_3px_0_0_#111111] flex items-center gap-1.5 hover:-translate-y-0.5"><span>닉네임</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg></button></nav>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContentArea -->
<main class="max-w-4xl mx-auto px-4 py-8">
<!-- Collapsed Question Summary Indicator -->
<section class="mb-8" data-purpose="question-reference">
<div class="border-[2.5px] border-dashed border-slate-400 bg-white/70 hover:bg-white rounded-lg p-3 text-center cursor-pointer transition-colors shadow-sm">
<div class="inline-flex items-center gap-2 text-xs font-bold text-slate-600 tracking-wide uppercase">
<svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
<span>질문 영역 펼치기 (QA-003: Spring Security FilterChain 등록 이슈 관련)</span>
</div>
</div>
</section>
<!-- Answers Header Count -->
<div class="flex items-center justify-between mb-5">
<div class="flex items-center gap-2.5">
<h2 class="text-xl font-extrabold tracking-tight text-black">답변</h2>
<span class="px-2.5 py-0.5 text-sm font-black bg-blue-600 text-white rounded-full neo-border">3</span>
</div>
<div class="text-xs font-bold text-slate-500">
        정렬: <span class="text-black underline cursor-pointer">추천순</span> · <span class="hover:underline cursor-pointer">최신순</span>
</div>
</div>
<!-- BEGIN: FirstAnswerCard_EditingState -->
<!-- Active Editing Card for Main Answer with Blue Highlight -->
<article class="relative bg-white neo-border-blue rounded-xl p-5 mb-7 shadow-brutal" data-purpose="answer-editing-card">
<!-- Edit Mode Status Header -->
<div class="flex items-center justify-between pb-4 border-b-2 border-slate-100">
<div class="flex items-center gap-2 flex-wrap">
<span class="inline-flex items-center gap-1 font-bold text-slate-900 text-base">
            백엔드3년차
            <span class="text-amber-500 font-bold" title="골드 등급">★</span>
</span>
<span class="bg-blue-100 text-blue-700 text-xs font-extrabold px-2 py-0.5 rounded border border-blue-300">
            (내 답변) - 수정 중
          </span>
</div>
<div class="flex items-center gap-1.5 text-xs text-blue-600 font-bold">
<span class="inline-block w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
          수정 모드 활성화됨
        </div>
</div>
<!-- Markdown / Textarea Input Container -->
<div class="mt-4">
<label class="sr-only" for="answer-edit-field">답변 수정 내용</label>
<div class="border-[2.5px] border-black rounded-lg overflow-hidden bg-white shadow-brutal-sm focus-within:ring-2 focus-within:ring-blue-500">
<!-- Editor formatting bar mock -->
<div class="bg-slate-100 px-3 py-1.5 border-b-[2px] border-black flex items-center justify-between text-xs text-slate-600 font-mono font-medium">
<div class="flex items-center gap-3">
<span class="font-bold cursor-pointer hover:text-black">B</span>
<span class="italic cursor-pointer hover:text-black">I</span>
<span class="cursor-pointer hover:text-black">&lt;/&gt;</span>
<span class="cursor-pointer hover:text-black">Link</span>
</div>
<span class="text-[11px] text-slate-500">Markdown 지원</span>
</div>
<!-- Code/Text Area Input -->
<textarea class="w-full p-3 font-mono text-sm leading-relaxed border-0 focus:ring-0 resize-y text-slate-900 bg-white" id="answer-edit-field" placeholder="답변 내용을 수정해주세요." rows="6">shouldNotFilter()를 오버라이드해서 ...</textarea></div></div><div class="mt-4 flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100"><button type="button" class="px-4 py-1.5 text-sm font-bold bg-white text-slate-700 border-[2.5px] border-[#111111] shadow-[3px_3px_0_0_#111111] hover:-translate-y-0.5 active:shadow-none">취소</button><button type="button" class="px-4 py-1.5 text-sm font-bold bg-blue-600 text-white border-[2.5px] border-[#111111] shadow-[3px_3px_0_0_#111111] hover:-translate-y-0.5 active:shadow-none">수정 완료</button></div></article></main>



</body></html>
