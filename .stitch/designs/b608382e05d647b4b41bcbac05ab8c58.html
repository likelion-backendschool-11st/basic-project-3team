<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">

<title>Dev in_ - 질문 수정</title>
<!-- Tailwind CSS CDN with Forms & Container-Queries Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cream-bg': '#FFFDF5',
            'neo-yellow': '#FACC15',
            'neo-blue': '#2563EB',
            'neo-blue-hover': '#1D4ED8',
            'neo-dark': '#111827',
          },
          boxShadow: {
            'neo-sm': '2px 2px 0 #111111',
            'neo-md': '3.5px 3.5px 0 #111111',
            'neo-hard': '5px 5px 0 #111111',
            'neo-hard-hover': '2px 2px 0 #111111',
          },
          borderWidth: {
            '3': '2.5px',
          }
        }
      }
    }
  </script>
<!-- Custom Styling for Neo-Brutalist details & Grid Background -->
<style data-purpose="neo-brutalist-grid-and-borders">
    body {
      background-color: #FFFDF5;
      background-image: radial-gradient(#d1d5db 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .neo-border {
      border: 2.5px solid #111111;
    }
    .neo-box-shadow {
      box-shadow: 5px 5px 0px #111111;
    }
    .neo-btn-shadow {
      box-shadow: 3.5px 3.5px 0px #111111;
    }
    .neo-btn-shadow:active {
      transform: translate(2px, 2px);
      box-shadow: 1.5px 1.5px 0px #111111;
    }
  </style>
</head>
<body class="min-h-screen text-gray-900 flex flex-col font-sans antialiased selection:bg-yellow-200" style="background-color: rgb(255, 253, 245); background-image: radial-gradient(rgb(217, 212, 195) 1px, transparent 1px); background-size: 18px 18px;">
<!-- BEGIN: MainHeader -->
<header class="w-full bg-white neo-border border-t-0 border-x-0 sticky top-0 z-50">
<div class="max-w-6xl mx-auto px-4 lg:px-8 h-16 flex items-center justify-between gap-4">
<!-- Brand Logo & Left Section -->
<div class="flex items-center gap-6">
<a href="#" class="flex items-center gap-1.5 text-xl font-black tracking-tight text-[#111111]" data-purpose="brand-logo"><span>Dev</span>
  <span class="bg-[#FFD43B] text-[#111111] font-mono font-bold text-sm px-1.5 py-0.5 border-[2.5px] border-[#111111] rounded shadow-[2px_2px_0_#111111]">in_</span></a>
</div>
<!-- Center Search Bar -->
<div class="w-[420px]" data-purpose="global-search"><input class="w-full h-10 px-3.5 text-sm font-medium bg-[#FAFAFA] placeholder-gray-500 focus:bg-white focus:outline-none focus:ring-0 text-gray-900 border-[2.5px] border-[#111111] rounded-[8px] transition-all" placeholder="검색어를 입력하세요" type="text"></div>
<!-- Right Actions: Ask, Notification, Profile -->
<div class="flex items-center gap-3"><button class="h-10 px-4 bg-[#2563EB] text-white font-bold text-sm border-[2.5px] border-[#111111] rounded-[10px] shadow-[3px_3px_0_#111111] hover:bg-blue-700 active:translate-x-[1px] active:translate-y-[1px] active:shadow-[1.5px_1.5px_0_#111111] transition-all flex items-center justify-center" type="button">질문하기</button><button aria-label="알림" class="relative h-10 px-3.5 bg-white text-gray-900 font-bold text-sm border-[2.5px] border-[#111111] rounded-[10px] shadow-[3px_3px_0_#111111] hover:bg-gray-50 active:translate-x-[1px] active:translate-y-[1px] active:shadow-[1.5px_1.5px_0_#111111] transition-all flex items-center justify-center" type="button"><span>알림</span><span class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 bg-red-600 text-white text-[11px] font-black rounded-full border-[1.5px] border-black flex items-center justify-center leading-none">3</span></button><button class="h-10 px-3.5 bg-[#FFD43B] text-gray-900 font-bold text-sm border-[2.5px] border-[#111111] rounded-[10px] shadow-[3px_3px_0_#111111] hover:bg-yellow-400 active:translate-x-[1px] active:translate-y-[1px] active:shadow-[1.5px_1.5px_0_#111111] transition-all flex items-center gap-1.5" type="button"><span>닉네임</span><svg class="w-3.5 h-3.5 text-gray-900 stroke-[2.5]" fill="currentColor" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" fill-rule="evenodd"></path></svg></button></div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 md:py-10">
<!-- Page Title -->
<div class="mb-6">
<h1 class="text-[22px] font-black tracking-tight text-gray-950 inline-block bg-white neo-border px-3 py-1 shadow-[3px_3px_0_#111111]">
        질문 수정
      </h1>
</div>
<!-- Question Edit Form Card -->
<form action="#" class="neo-border bg-white neo-box-shadow p-6 md:p-8 space-y-6" data-purpose="question-edit-form" method="POST">
<!-- Title Section -->
<div class="space-y-1.5">
<label class="block font-black text-sm text-gray-900" for="post-title">제목</label>
<div class="neo-border flex items-center bg-white overflow-hidden focus-within:ring-2 focus-within:ring-black">
<div class="bg-gray-100 border-r-[2.5px] border-black px-4 py-2.5 font-bold text-sm text-gray-700 select-none">
            제목
          </div>
<input class="w-full px-3.5 py-2.5 text-sm font-semibold border-none focus:ring-0 bg-transparent text-gray-900" id="post-title" maxlength="50" name="title" placeholder="제목을 입력하세요 (최대 50자)" type="text" value="Spring Boot에서 JWT 필터가 두 번 실행돼요">
<div class="px-3.5 text-xs font-bold text-gray-500 whitespace-nowrap bg-gray-50 h-full flex items-center border-l-[2.5px] border-black py-2.5">
<span class="text-blue-600 font-extrabold">29</span>&nbsp;/ 50
          </div>
</div>
</div>
<!-- Markdown Editor Container -->
<div class="space-y-1.5" data-purpose="markdown-editor-wrapper">
<label class="block font-black text-sm text-gray-900">내용</label>
<div class="neo-border bg-white overflow-hidden">
<!-- Editor Toolbar -->
<div class="flex flex-wrap items-center justify-between bg-gray-100 border-b-[2.5px] border-black px-2 py-1.5 gap-2 select-none">
<!-- Left Toolbar Buttons -->
<div class="flex items-center gap-1.5 flex-wrap">
<button class="w-8 h-8 font-black text-sm bg-white neo-border hover:bg-yellow-200 flex items-center justify-center transition-colors" title="굵게" type="button">
                B
              </button>
<button class="w-8 h-8 italic font-serif font-black text-sm bg-white neo-border hover:bg-yellow-200 flex items-center justify-center transition-colors" title="기울임" type="button">
                I
              </button>
<button class="h-8 px-2.5 font-mono font-bold text-xs bg-white neo-border hover:bg-yellow-200 flex items-center justify-center transition-colors" title="코드 블록" type="button">
                코드 블록 <span class="text-gray-500 ml-1">```</span>
</button>
<button class="h-8 px-2.5 font-bold text-xs bg-white neo-border hover:bg-yellow-200 flex items-center justify-center transition-colors" title="링크 삽입" type="button">
                링크
              </button>
<button class="h-8 px-2.5 font-bold text-xs bg-white neo-border hover:bg-yellow-200 flex items-center justify-center transition-colors" title="이미지 추가" type="button">
                이미지
              </button>
</div>
<!-- Right Mode Switch Tabs -->
<div class="flex items-center gap-1">
<button class="px-3 py-1 font-bold text-xs bg-white neo-border shadow-[1.5px_1.5px_0_#111111] hover:bg-gray-50" data-purpose="editor-tab-write" type="button">
                작성
              </button>
<button class="px-3 py-1 font-bold text-xs bg-gray-200 border border-gray-400 text-gray-600 hover:bg-white hover:text-black hover:neo-border transition-all" data-purpose="editor-tab-preview" type="button">
                미리보기
              </button>
</div>
</div>
<!-- Content Textarea with Pre-filled Markdown -->
<div class="p-1">
<textarea class="w-full p-4 font-mono text-sm leading-relaxed border-none focus:ring-0 resize-y bg-[#FCFDFE] text-gray-800 placeholder-gray-400" name="content" placeholder="질문 내용을 자세하게 작성해주세요 (Markdown 지원)" rows="12">## 개발 환경
Java 17, Spring Boot 3.2

## 에러 메시지</textarea></div></div></div><div class="space-y-1.5"><label class="block font-black text-sm text-gray-900">태그</label><div class="flex flex-wrap items-center gap-2 p-2.5 bg-white border-[2.5px] border-[#111111] rounded-[8px]"><span class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-bold bg-[#FFD43B] border-[2px] border-[#111111] rounded shadow-[1.5px_1.5px_0_#111111]">Spring Boot <button type="button" class="hover:text-red-600 font-extrabold">×</button></span><span class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-bold bg-gray-100 border-[2px] border-[#111111] rounded shadow-[1.5px_1.5px_0_#111111]">JWT <button type="button" class="hover:text-red-600 font-extrabold">×</button></span><span class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-bold bg-gray-100 border-[2px] border-[#111111] rounded shadow-[1.5px_1.5px_0_#111111]">Spring Security <button type="button" class="hover:text-red-600 font-extrabold">×</button></span><input type="text" placeholder="태그를 입력하세요 (최대 5개)" class="flex-1 min-w-[150px] border-none bg-transparent text-sm py-1 px-2 text-gray-900 placeholder-gray-400 focus:ring-0"></div></div><div class="flex items-center justify-end gap-3 pt-4 border-t-[2.5px] border-[#111111]"><button type="button" class="h-11 px-5 bg-white text-gray-800 font-bold text-sm border-[2.5px] border-[#111111] rounded-[8px] shadow-[3px_3px_0_#111111] hover:bg-gray-100 active:translate-x-[1px] active:translate-y-[1px] active:shadow-[1.5px_1.5px_0_#111111] transition-all">취소</button><button type="submit" class="h-11 px-6 bg-[#2563EB] text-white font-extrabold text-sm border-[2.5px] border-[#111111] rounded-[8px] shadow-[3px_3px_0_#111111] hover:bg-blue-700 active:translate-x-[1px] active:translate-y-[1px] active:shadow-[1.5px_1.5px_0_#111111] transition-all">수정 완료</button></div></form></main>







</body></html>
