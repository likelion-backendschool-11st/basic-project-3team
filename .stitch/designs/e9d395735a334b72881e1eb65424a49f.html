<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>질문 신고 - Dev in_</title>
<!-- Google Fonts: Noto Sans KR -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#FFFDF9',
              dark: '#111827',
              red: '#E11D48',
              yellow: '#FACC15',
              grayBg: '#F3F4F6'
            }
          },
          boxShadow: {
            'brutal-sm': '2px 2px 0px #111827',
            'brutal': '3px 3px 0px #111827',
            'brutal-lg': '6px 6px 0px #111827',
            'brutal-xl': '8px 8px 0px #111827',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Neo-Brutalism Styles -->
<style data-purpose="custom-brutalism">
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }

    /* Custom Radio Styling adhering to Neo-brutalism */
    .brutal-radio {
      appearance: none;
      -webkit-appearance: none;
      width: 1.25rem;
      height: 1.25rem;
      border: 2px solid #111827;
      border-radius: 9999px;
      outline: none;
      background-color: #FFFDF9;
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      transition: all 0.15s ease-in-out;
    }

    .brutal-radio::before {
      content: "";
      width: 0.625rem;
      height: 0.625rem;
      border-radius: 50%;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      background-color: #111827;
    }

    .brutal-radio:checked::before {
      transform: scale(1);
    }

    .brutal-radio:focus-visible {
      outline: 2px solid #111827;
      outline-offset: 2px;
    }
  </style>
<!-- END: Custom Neo-Brutalism Styles -->
</head>
<body class="bg-[#e9edf2] text-gray-900 min-h-screen relative overflow-x-hidden selection:bg-yellow-300">
<!-- BEGIN: Underlying App Mockup (Blurred Background Layer) -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none select-none filter blur-[8px] opacity-70 flex flex-col">
<!-- Mockup Header -->
<header class="bg-[#FFFDF9] border-b-[2.5px] border-black px-8 py-3.5 flex items-center justify-between">
<div class="flex items-center gap-6"><div class="flex items-center gap-6"><a href="#" class="font-black text-2xl tracking-tight text-black flex items-center gap-1.5"><span>Dev</span><span class="bg-[#FFD43B] text-black text-sm px-2 py-0.5 rounded border-2 border-black font-mono font-bold">in_</span></a><div class="w-96 px-4 py-2 bg-white border-[2.5px] border-black rounded-[8px] text-sm text-gray-400">검색어를 입력하세요</div></div></div>
<div class="flex items-center gap-3"><button type="button" class="px-4 py-1.5 bg-[#2563EB] text-white border-[2.5px] border-black rounded-[8px] font-bold text-sm shadow-[3px_3px_0px_#111111] hover:translate-x-[1px] hover:translate-y-[1px]">질문하기</button><button type="button" class="relative px-4 py-1.5 bg-white text-black border-[2.5px] border-black rounded-[8px] font-bold text-sm shadow-[3px_3px_0px_#111111] flex items-center gap-1"><span>알림</span><span class="inline-flex items-center justify-center w-4 h-4 bg-[#E11D48] text-white text-[10px] font-bold rounded-full">3</span></button><button type="button" class="px-4 py-1.5 bg-[#FFD43B] text-black border-[2.5px] border-black rounded-[8px] font-bold text-sm shadow-[3px_3px_0px_#111111]">닉네임 ▾</button></div>
</header>
<!-- Mockup Main Content Wireframe -->
<main class="max-w-4xl mx-auto w-full p-8 space-y-6">
<div class="h-8 bg-gray-300 rounded w-3/4"></div>
<div class="h-4 bg-gray-300 rounded w-1/4"></div>
<div class="p-6 bg-white border-2 border-black rounded-xl space-y-4">
<div class="h-4 bg-gray-200 rounded w-full"></div>
<div class="h-4 bg-gray-200 rounded w-5/6"></div>
<div class="h-4 bg-gray-200 rounded w-4/6"></div>
</div>
</main>
</div>
<!-- END: Underlying App Mockup -->
<!-- BEGIN: Backdrop Overlay -->
<div class="fixed inset-0 bg-[#FFFDF9]/40 backdrop-blur-md z-40 flex items-center justify-center p-4" style="background-color: rgba(255, 253, 245, 0.55); backdrop-filter: blur(8px);">
<!-- Wrapper for Modal and Toast Stack -->
<div class="w-full max-w-lg flex flex-col items-center gap-5" style="max-width: 440px; width: 100%;">
<!-- BEGIN: Report Modal Dialog -->
<div aria-labelledby="modal-title" aria-modal="true" class="w-full bg-[#FFFDF9] border-[2.5px] border-black rounded-[14px] shadow-[8px_8px_0px_#111827] overflow-hidden" data-purpose="report-modal" role="dialog">
<!-- Modal Header -->
<div class="px-6 pt-6 pb-2 flex items-center justify-between border-b border-transparent">
<h2 class="text-[20px] font-[800] text-black tracking-tight flex items-center gap-2" id="modal-title">
            질문 신고
          </h2>
<!-- Close Button -->
<button aria-label="닫기" class="w-8 h-8 flex items-center justify-center rounded-lg border-2 border-transparent hover:border-black hover:bg-black/5 active:translate-x-0.5 active:translate-y-0.5 transition-all text-xl font-bold leading-none text-black" type="button">
            ✕
          </button>
</div>
<!-- Subtitle Prompt -->
<div class="px-6 pt-1 pb-4">
<p class="text-sm font-semibold text-gray-700">
            신고 사유를 선택해주세요
          </p>
</div>
<!-- Modal Body: Radio Options & Textarea -->
<form class="px-6 pb-6 space-y-4" id="reportForm" onsubmit="event.preventDefault();">
<!-- Radio List -->
<fieldset class="space-y-3" data-purpose="report-reasons-list">
<legend class="sr-only">신고 사유 목록</legend>
<!-- Option 1: 스팸 · 광고 (Default Selected) -->
<label class="flex items-center gap-3 cursor-pointer group py-0.5 select-none">
<input checked="" class="brutal-radio" name="reportReason" type="radio" value="spam">
<span class="text-sm font-medium text-black group-hover:text-gray-600 transition-colors">
                스팸 · 광고
              </span>
</label>
<!-- Option 2: 욕설 · 비방 -->
<label class="flex items-center gap-3 cursor-pointer group py-0.5 select-none">
<input class="brutal-radio" name="reportReason" type="radio" value="abusive">
<span class="text-sm font-medium text-black group-hover:text-gray-600 transition-colors">
                욕설 · 비방
              </span>
</label>
<!-- Option 3: 음란 · 불쾌한 내용 -->
<label class="flex items-center gap-3 cursor-pointer group py-0.5 select-none">
<input class="brutal-radio" name="reportReason" type="radio" value="inappropriate">
<span class="text-sm font-medium text-black group-hover:text-gray-600 transition-colors">
                음란 · 불쾌한 내용
              </span>
</label>
<!-- Option 4: 개인정보 노출 -->
<label class="flex items-center gap-3 cursor-pointer group py-0.5 select-none">
<input class="brutal-radio" name="reportReason" type="radio" value="privacy">
<span class="text-sm font-medium text-black group-hover:text-gray-600 transition-colors">
                개인정보 노출
              </span>
</label>
<!-- Option 5: 질문과 무관한 내용 · 도배 -->
<label class="flex items-center gap-3 cursor-pointer group py-0.5 select-none">
<input class="brutal-radio" name="reportReason" type="radio" value="irrelevant">
<span class="text-sm font-medium text-black group-hover:text-gray-600 transition-colors">
                질문과 무관한 내용 · 도배
              </span>
</label>
<!-- Option 6: 저작권 침해 -->
<label class="flex items-center gap-3 cursor-pointer group py-0.5 select-none">
<input class="brutal-radio" name="reportReason" type="radio" value="copyright">
<span class="text-sm font-medium text-black group-hover:text-gray-600 transition-colors">
                저작권 침해
              </span>
</label>
<!-- Option 7: 기타 (직접 입력) -->
<label class="flex items-center gap-3 cursor-pointer group py-0.5 select-none">
<input class="brutal-radio" id="radioEtc" name="reportReason" type="radio" value="etc">
<span class="text-sm font-medium text-black group-hover:text-gray-600 transition-colors">
                기타 (직접 입력)
              </span>
</label>
</fieldset>
<!-- Input Textarea for Additional Details / Etc Option -->
<div class="pt-2">
<textarea class="w-full text-sm font-normal p-3 rounded-lg border-[2px] border-black bg-gray-100 placeholder-gray-400 focus:bg-white focus:outline-none focus:ring-0 focus:border-black resize-none transition-colors duration-200 disabled:opacity-75 disabled:cursor-not-allowed" data-purpose="custom-reason-textarea" disabled="" id="etcReasonInput" placeholder="기타 사유를 입력하세요 (기타 선택 시 활성화)" rows="3"></textarea>
</div>
<!-- Bottom Action Buttons -->
<div class="pt-4 flex items-center justify-center gap-4">
<!-- Cancel Button -->
<button class="w-32 py-2.5 px-5 bg-white text-black font-bold text-sm border-[2.5px] border-black rounded-lg shadow-[3px_3px_0px_#111827] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0px_#111827] active:translate-x-[3px] active:translate-y-[3px] active:shadow-none transition-all text-center" type="button">
              취소
            </button>
<!-- Submit Button (Danger Red) -->
<button class="w-32 py-2.5 px-5 bg-[#E11D48] text-white font-bold text-sm border-[2.5px] border-black rounded-lg shadow-[3px_3px_0px_#111827] hover:bg-[#d0153f] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0px_#111827] active:translate-x-[3px] active:translate-y-[3px] active:shadow-none transition-all text-center" type="submit">
              신고하기
            </button>
</div>
</form>
</div>
<!-- END: Report Modal Dialog -->
<!-- BEGIN: Bottom Notification Toast -->
<div aria-live="polite" class="w-full max-w-sm px-6 py-3 bg-[#FFFDF9] border-[2.5px] border-black rounded-xl shadow-[4px_4px_0px_#111827] flex items-center justify-center gap-2.5 text-center transition-all animate-bounce-short" data-purpose="toast-notification" role="status">
<!-- Info Icon -->
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-black text-white text-xs font-black">!</span>
<span class="text-sm font-bold text-black tracking-tight">이미 신고한 글입니다</span>
</div>
<!-- END: Bottom Notification Toast -->
</div>
</div>
<!-- END: Backdrop Overlay -->
<!-- BEGIN: Interactive Logic for Radio and Textarea -->
<script data-purpose="radio-toggle-listener">
    document.addEventListener('DOMContentLoaded', () => {
      const radioButtons = document.querySelectorAll('input[name="reportReason"]');
      const textarea = document.getElementById('etcReasonInput');

      function updateTextareaState() {
        const etcSelected = document.getElementById('radioEtc').checked;
        if (etcSelected) {
          textarea.disabled = false;
          textarea.classList.remove('bg-gray-100', 'cursor-not-allowed', 'opacity-75');
          textarea.classList.add('bg-white');
          textarea.focus();
        } else {
          textarea.disabled = true;
          textarea.classList.add('bg-gray-100', 'cursor-not-allowed', 'opacity-75');
          textarea.classList.remove('bg-white');
        }
      }

      radioButtons.forEach(radio => {
        radio.addEventListener('change', updateTextareaState);
      });
    });
  </script>
<!-- END: Interactive Logic for Radio and Textarea -->


</body></html>
